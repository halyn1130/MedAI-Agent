<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#16806a"/></marker>
</defs><rect width="1680" height="1390" fill="#f7f9fc"/>
<g font-family="Apple SD Gothic Neo, sans-serif">
<text x="60" y="56" font-size="18" fill="#4263aa" font-weight="700">MedAI-Agent / MULTI-AGENT WORKFLOW</text>
<text x="60" y="103" font-size="36" fill="#15273f" font-weight="700">7개 에이전트가 협업하는 투자 평가 흐름</text>
<text x="60" y="142" font-size="21" fill="#475569" font-weight="400">기업·제품 조사 → 4개 분야 병렬 분석 → 투자 심사 → 보고서 작성</text>
<rect x="1440" y="57" width="180" height="38" rx="19" fill="#e9eef6" stroke="#e9eef6"/>
<text x="1465" y="83" font-size="17" fill="#52647e" font-weight="600">DESIGN / 설계안</text>
<rect x="60" y="183" width="465" height="120" rx="16" fill="#fff" stroke="#dfe6ee"/>
<text x="82" y="218" font-size="22" fill="#15273f" font-weight="700">후보 데이터</text>
<text x="82" y="251" font-size="18" fill="#475569" font-weight="400">10~30개 · 비상장 · Series B~C</text>
<text x="82" y="278" font-size="18" fill="#475569" font-weight="400">Exit 미완료 · AI 핵심 제품</text>
<rect x="545" y="183" width="575" height="120" rx="16" fill="#fff" stroke="#dfe6ee"/>
<text x="567" y="218" font-size="22" fill="#15273f" font-weight="700">시장·사업성 RAG 지식베이스</text>
<text x="567" y="251" font-size="18" fill="#475569" font-weight="400">시장·산업 보고서 → 청크 → 임베딩 → 인덱스</text>
<text x="567" y="278" font-size="18" fill="#475569" font-weight="400">200페이지 이하 · 모델 실측 비교 · 출처 보존</text>
<rect x="1140" y="183" width="480" height="120" rx="16" fill="#fff" stroke="#dfe6ee"/>
<text x="1162" y="218" font-size="22" fill="#15273f" font-weight="700">평가 정책</text>
<text x="1162" y="251" font-size="18" fill="#475569" font-weight="400">6항목 가중치 · 임계값 · 레드플래그</text>
<text x="1162" y="278" font-size="18" fill="#475569" font-weight="400">정보 없음 규칙 · 후보 수 / 보완 횟수 제한</text>
<path d="M 205 600 V 347 H 1490 V 600" fill="none" stroke="#b7791f" stroke-width="2" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="480" y="330" width="810" height="34" rx="0" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="496" y="354" font-size="19" fill="#9a651b" font-weight="600">후보 없음 / 전원 보류 / 후보 상한 도달 → 종료 보고서</text>
<rect x="460" y="437" width="560" height="508" rx="20" fill="#eef2f8" stroke="#dce4ef"/>
<text x="490" y="474" font-size="23" fill="#15273f" font-weight="700">병렬 분석</text>
<text x="625" y="474" font-size="17" fill="#475569" font-weight="400">동일 기업 프로필 · 독립된 분석 결과</text>
<rect x="490" y="495" width="500" height="100" rx="16" fill="#ffffff" stroke="#dfe6ee"/>
<text x="512" y="530" font-size="22" fill="#15273f" font-weight="700">2  임상·인허가 분석</text>
<text x="512" y="563" font-size="18" fill="#475569" font-weight="400">임상 검증 · 허가 상태와 사용 목적</text>
<text x="512" y="590" font-size="18" fill="#475569" font-weight="400">기업의 성능 주장과 검증 근거 구분</text>
<rect x="490" y="605" width="500" height="100" rx="16" fill="#f5f0ff" stroke="#ded4ee"/>
<text x="512" y="640" font-size="22" fill="#15273f" font-weight="700">3  시장·사업성 분석</text>
<text x="512" y="673" font-size="18" fill="#475569" font-weight="400">시장 규모·수요 · 병원 도입 · 수익 모델</text>
<text x="512" y="700" font-size="18" fill="#475569" font-weight="400">시장·산업 보고서에서 근거 검색</text>
<rect x="903" y="618" width="67" height="28" rx="14" fill="#e5daf6" stroke="#e5daf6"/>
<text x="918" y="639" font-size="15" fill="#7757a6" font-weight="700">RAG</text>
<rect x="490" y="715" width="500" height="100" rx="16" fill="#ffffff" stroke="#dfe6ee"/>
<text x="512" y="750" font-size="22" fill="#15273f" font-weight="700">4  실적·성장성 분석</text>
<text x="512" y="783" font-size="18" fill="#475569" font-weight="400">매출·계약·유료 고객 · 도입 성과·기간별 변화</text>
<text x="512" y="810" font-size="18" fill="#475569" font-weight="400">MOU·실증·상용 구분 / 투자 유치와 매출 분리</text>
<rect x="490" y="825" width="500" height="100" rx="16" fill="#ffffff" stroke="#dfe6ee"/>
<text x="512" y="860" font-size="22" fill="#15273f" font-weight="700">5  리스크 분석</text>
<text x="512" y="893" font-size="18" fill="#475569" font-weight="400">고객 집중 · 계약 불확실성 · 데이터 의존성</text>
<text x="512" y="920" font-size="18" fill="#475569" font-weight="400">공개 근거·미확인 사항 → 추가 실사 질문</text>
<rect x="60" y="600" width="320" height="240" rx="16" fill="#eef4ff" stroke="#cfddf5"/>
<text x="82" y="635" font-size="22" fill="#15273f" font-weight="700">1  기업·제품 조사</text>
<text x="82" y="668" font-size="18" fill="#475569" font-weight="400">기업 정보·후보 적격성 확인</text>
<text x="82" y="695" font-size="18" fill="#475569" font-weight="400">제품·AI 기능·대상 고객 정리</text>
<text x="82" y="722" font-size="18" fill="#475569" font-weight="400">공개 기술 설명·논문 링크</text>
<text x="82" y="749" font-size="18" fill="#475569" font-weight="400">기술 우수성은 판정하지 않음</text>
<text x="82" y="776" font-size="18" fill="#475569" font-weight="400">주장별 출처·기준일·확인 상태</text>
<text x="82" y="803" font-size="18" fill="#475569" font-weight="400">공통 기업 프로필 생성</text>
<text x="70" y="872" font-size="17" fill="#64748b" font-weight="400">적격 후보 프로필을 4개 Agent에 전달</text>
<path d="M 380 690 H 420" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M420 545 V875" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M420 545 H490" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M420 655 H490" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M420 765 H490" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M420 875 H490" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M990 545 H1040" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M990 655 H1040" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M990 765 H1040" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M990 875 H1040" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M1040 545 V875" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M1040 690 H1100" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1039" y="920" font-size="16" fill="#64748b" font-weight="400">모두 완료 후 취합</text>
<rect x="1100" y="600" width="245" height="210" rx="16" fill="#eef4ff" stroke="#cfddf5"/>
<text x="1122" y="635" font-size="22" fill="#15273f" font-weight="700">6  투자 심사</text>
<text x="1122" y="668" font-size="18" fill="#475569" font-weight="400">근거 충돌·누락 확인</text>
<text x="1122" y="695" font-size="18" fill="#475569" font-weight="400">6항목 평가·레드플래그</text>
<text x="1122" y="722" font-size="18" fill="#475569" font-weight="400">Python 함수로 점수 계산</text>
<text x="1122" y="749" font-size="18" fill="#475569" font-weight="400">정책 적용 → 투자 / 보류</text>
<text x="1122" y="776" font-size="18" fill="#475569" font-weight="400">필요 시 담당 분석에 보완</text>
<rect x="1390" y="600" width="230" height="180" rx="16" fill="#eaf7f2" stroke="#b8dfd1"/>
<text x="1412" y="635" font-size="22" fill="#15273f" font-weight="700">7  보고서 작성</text>
<text x="1412" y="668" font-size="18" fill="#475569" font-weight="400">점수·판단 근거</text>
<text x="1412" y="695" font-size="18" fill="#475569" font-weight="400">기업·시장·팀·리스크</text>
<text x="1412" y="722" font-size="18" fill="#475569" font-weight="400">분석 한계·REFERENCE</text>
<text x="1412" y="749" font-size="18" fill="#475569" font-weight="400">투자 / 종료 보고서</text>
<path d="M1345 690 H1390" fill="none" stroke="#16806a" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1350" y="670" font-size="15" fill="#16806a" font-weight="700">투자</text>
<path d="M1220 600 V400 H740 V437" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="780" y="381" width="420" height="32" rx="0" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="790" y="404" font-size="18" fill="#52647e" font-weight="600">근거 부족·충돌 → 해당 Agent만 보완</text>
<path d="M1220 810 V997 H205 V840" fill="none" stroke="#b7791f" stroke-width="2" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="430" y="979" width="700" height="34" rx="0" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="442" y="1003" font-size="18" fill="#9a651b" font-weight="600">보류 → 결과 보존 · 다음 후보 이동 · 기업별 State 초기화</text>
<text x="60" y="1070" font-size="21" fill="#15273f" font-weight="700">공통 실행 규칙</text>
<rect x="60" y="1092" width="510" height="205" rx="16" fill="#f5f0ff" stroke="#ded4ee"/>
<text x="82" y="1127" font-size="22" fill="#15273f" font-weight="700">RAG · 보완 요청</text>
<text x="82" y="1160" font-size="18" fill="#475569" font-weight="400">Hybrid 검색: BM25 + Dense · Reranker 선택</text>
<text x="82" y="1187" font-size="18" fill="#475569" font-weight="400">시장·사업성 Agent에만 RAG 적용</text>
<text x="82" y="1214" font-size="18" fill="#475569" font-weight="400">시장: RAG 재검색 / 나머지: 자료 조회·재분석</text>
<text x="82" y="1241" font-size="18" fill="#475569" font-weight="400">상한 도달 시 정보 없음 규칙으로 투자/보류 결정</text>
<rect x="590" y="1092" width="500" height="205" rx="16" fill="#fff" stroke="#dfe6ee"/>
<text x="612" y="1127" font-size="22" fill="#15273f" font-weight="700">공유 State · 외부 도구</text>
<text x="612" y="1160" font-size="18" fill="#475569" font-weight="400">동일 기업 프로필 → 4개 분야 독립 분석</text>
<text x="612" y="1187" font-size="18" fill="#475569" font-weight="400">evidence / references는 Reducer로 누적</text>
<text x="612" y="1214" font-size="18" fill="#475569" font-weight="400">후보 변경 시 결과 보존 · 분석·재시도 초기화</text>
<text x="612" y="1241" font-size="18" fill="#475569" font-weight="400">웹검색 · DART 교차 확인 · KIPRIS(선택)</text>
<rect x="1110" y="1092" width="510" height="205" rx="16" fill="#eaf7f2" stroke="#b8dfd1"/>
<text x="1132" y="1127" font-size="22" fill="#15273f" font-weight="700">보고서 출력 · 종료</text>
<text x="1132" y="1160" font-size="18" fill="#475569" font-weight="400">Markdown → PDF · 수치와 인용 검증</text>
<text x="1132" y="1187" font-size="18" fill="#475569" font-weight="400">전체 5페이지 · SUMMARY 1/2페이지 이내</text>
<text x="1132" y="1214" font-size="18" fill="#475569" font-weight="400">analysis.json / report.md / report.pdf</text>
<text x="1132" y="1241" font-size="18" fill="#475569" font-weight="400">첫 투자 추천 또는 후보 소진 시 보고서 후 종료</text>
<text x="60" y="1349" font-size="17" fill="#475569" font-weight="400">실선: 실행 흐름   |   점선: 해당 분석 보완   |   주황: 다음 후보 / 종료 분기</text>
<text x="1190" y="1349" font-size="15" fill="#475569" font-weight="400">모델·가중치·임계값은 팀 검토 후 확정</text>
</g></svg>